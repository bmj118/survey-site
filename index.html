<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>MBTI 설문</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .question { margin-bottom: 20px; }
    .buttons button {
      margin: 3px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .buttons button.active {
      background: #000;
      color: #fff;
    }
    #submit {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>MBTI 설문</h1>

<div id="questions"></div>

<button id="submit" disabled>결과 보기</button>

<script>
const questions = [
  { id: 1, text: "사람들과 함께 있을 때 에너지가 난다", axis: "EI", direction: "E" },
  { id: 2, text: "혼자 있는 시간이 꼭 필요하다", axis: "EI", direction: "I" },
  { id: 3, text: "미래 가능성을 자주 상상한다", axis: "NS", direction: "N" },
  { id: 4, text: "현실적인 정보가 더 중요하다", axis: "NS", direction: "S" },
  { id: 5, text: "결정보다 논리가 중요하다", axis: "TF", direction: "T" },
  { id: 6, text: "사람 감정을 우선 고려한다", axis: "TF", direction: "F" },
  { id: 7, text: "계획이 있어야 마음이 편하다", axis: "PJ", direction: "J" },
  { id: 8, text: "즉흥적인 게 더 좋다", axis: "PJ", direction: "P" }
];

// 질문 섞기
questions.sort(() => Math.random() - 0.5);

const answers = {};
const container = document.getElementById("questions");
const submitBtn = document.getElementById("submit");

questions.forEach(q => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `<p>${q.text}</p>`;
  const btns = document.createElement("div");
  btns.className = "buttons";

  for (let i = 1; i <= 5; i++) {
    const b = document.createElement("button");
    b.textContent = i;
    b.onclick = () => {
      [...btns.children].forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      answers[q.id] = i;
      submitBtn.disabled = Object.keys(answers).length !== questions.length;
    };
    btns.appendChild(b);
  }

  div.appendChild(btns);
  container.appendChild(div);
});

function addScore(scores, dir, value) {
  if (value === 5) scores[dir] += 2;
  else if (value === 4) scores[dir] += 1;
  else if (value === 2) scores[opposite(dir)] += 1;
  else if (value === 1) scores[opposite(dir)] += 2;
}

function opposite(d) {
  return {E:"I", I:"E", N:"S", S:"N", T:"F", F:"T", P:"J", J:"P"}[d];
}

submitBtn.onclick = () => {
  const scores = {E:0,I:0,N:0,S:0,T:0,F:0,P:0,J:0};

  questions.forEach(q => {
    addScore(scores, q.direction, answers[q.id]);
  });

  const mbti =
    (scores.E >= scores.I ? "E":"I") +
    (scores.N >= scores.S ? "N":"S") +
    (scores.T >= scores.F ? "T":"F") +
    (scores.P >= scores.J ? "P":"J");

  const params = new URLSearchParams({ mbti, ...scores }).toString();
  location.href = "result.html?" + params;
};
</script>

</body>
</html>
